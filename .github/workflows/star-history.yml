name: Star History

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch star timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github.v3.star+json" \
            repos/${{ github.repository }}/stargazers \
            --paginate --jq '.[].starred_at' > star-times.txt
          echo "stars: $(wc -l < star-times.txt)"

      - name: Generate SVG
        run: python .github/scripts/star-history.py < star-times.txt > star-history.svg

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- star-history.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add star-history.svg
            git commit -m "chore(dev): 更新星数曲线"
            git push
          else
            echo "no change, skip commit"
          fi
