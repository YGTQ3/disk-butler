<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Z1 立体 C 盘（黑底）：唯一创意 = "被切开的立体圆环——切开是为了看清里面"。
       工艺：Qoder 六条（体积化/单一创意/黑白+品牌色/79%占比/统一偏移向量/不对称切口=5%放肆） -->

  <!-- 纯黑底 -->
  <rect x="64" y="64" width="896" height="896" rx="216" fill="#0B0F0E"/>

  <!-- 厚度层：右下偏移 (22,30)，深青绿侧壁 -->
  <path d="M 702.9 309.1 A 270 270 0 1 0 733.2 654.9"
        fill="none" stroke="#0A6B5C" stroke-width="170" stroke-linecap="butt"
        transform="translate(22 30)"/>

  <!-- 顶面环：白 -->
  <path d="M 702.9 309.1 A 270 270 0 1 0 733.2 654.9"
        fill="none" stroke="#FFFFFF" stroke-width="170" stroke-linecap="butt"/>

  <!-- 切面：亮薄荷点睛（连接顶面端口与厚度层端口） -->
  <path d="M 642.8 369.2 L 763.0 249.0 L 785.0 279.0 L 664.8 399.2 Z" fill="#2BDDB9"/>
  <path d="M 663.6 606.1 L 802.8 703.6 L 824.8 733.6 L 685.6 636.1 Z" fill="#2BDDB9"/>
</svg>
