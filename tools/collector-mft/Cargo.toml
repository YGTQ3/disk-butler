[package]
name = "diskbutler-collector-mft"
version = "0.1.0"
edition = "2021"
description = "C盘管家 MFT 全盘秒级透视采集器（独立版，需管理员权限）"

[[bin]]
name = "DiskButlerCollectorMFT"
path = "src/main.rs"

[dependencies]
# MFT 直读扫描（WizTree 同款原理）：ntfs-reader 顺序读 $MFT + rayon 并行解析
ntfs-reader = "0.4"
rayon = "1"
serde_json = "1"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 体积不做极限压缩：MFT 引擎（rayon/ntfs-reader）与体积权衡下取默认发布优化
[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
